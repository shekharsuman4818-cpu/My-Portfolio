<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        width:80%;
        padding: 100px;
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at top right , #252044 , transparent 40%) , linear-gradient(135deg , #080808, #151515 , #080808);
        color: white;
    }

    .contact{
        background-color: #2a2a2a;
        padding: 40px;
        border-radius: 20px;
        border: 2px solid #3a3a3a;
        box-shadow: 0px 8px 25px rgba(0,0,0,0,4);
    }

    nav{
        display: flex;
        justify-content: flex-start;
        flex-wrap: wrap;
        margin-bottom: 30px;
    }

    nav a{
        text-decoration: none;
        color: white;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border : 1px solid rgba(255,255,255,0.2);
        border-radius: 15px;
        padding: 10px;
    }

    nav a:hover{
                color:goldenrod;
            transform: translateY(-2px);
    }

    h1{
        color: goldenrod;
       text-align: center;
       margin-bottom: 20px;
       font-size: 36px;
    }
    form{
        display: grid;
        grid-template-columns: 1fr;
        align-items: center;
        gap: 20px;
    }

    label{
        color: azure;
        font-weight: bolder;
    }

    input , textarea{
        font-family: Arial, Helvetica, sans-serif;
        padding: 10px;
        border-radius: 8px;
    }

    input:hover , textarea:hover{
        border: 2px solid aliceblue;
        transform: translateY(-3px);
    }

    button{
        padding: 10px;
        border: none;
        border-radius: 20px;
       width: 500px;
       margin:auto;  
       background: rgb(214, 51, 214);
       font-weight: bolder;
       cursor: pointer;
    }

    button:hover{
       transform: translateY(-5px);
    }

</style>
<body>
    <nav>
        <a href="index.html">Home</a>
    </nav>
    <h1>Contact Me</h1>
    <div class="contact">
    <form>
    <label for="name">Name:</label>
    <input type="text" placeholder="Enter your name" required >
    <label>Email:</label>
    <input type="email" placeholder="Enter your email" required>
    <label>Message:</label>
     <textarea placeholder="Enter your message" required></textarea>
    <button type="submit">Submit</button>
    </form>
    </div>
</body>
</html>
